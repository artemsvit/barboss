name: BarBoss
options:
  bundleIdPrefix: com.barboss
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  BarBoss:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BarBoss/Sources
      - path: BarBoss/Resources
    dependencies:
      - package: Sparkle
        product: Sparkle
      - target: BarBossVisibilityAgent
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: BarBoss/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        SUFeedURL: https://barboss.artsvit.com/appcast.xml
        SUPublicEDKey: qCe12n2kfrYp7PYoMojEtF5I3YWI7QA7vKIh1KbUYzM=
        SUEnableAutomaticChecks: true
        NSHumanReadableCopyright: "Copyright © 2026 BarBoss. All rights reserved."
    entitlements:
      path: BarBoss/Resources/BarBoss.entitlements
    settings:
      PRODUCT_NAME: BarBoss
      PRODUCT_BUNDLE_IDENTIFIER: com.barboss.app
      MARKETING_VERSION: "1.0.3"
      CURRENT_PROJECT_VERSION: "4"
      DEVELOPMENT_TEAM: 8KK8V96Q6B
      CODE_SIGN_IDENTITY: "Developer ID Application: Artem Svitelskyi (8KK8V96Q6B)"
      ENABLE_HARDENED_RUNTIME: YES
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: BarBoss/Resources/Info.plist
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      COMBINE_HIDPI_IMAGES: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BarBossVisibilityAgent:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BarBossVisibilityAgent
    settings:
      PRODUCT_NAME: BarBossVisibilityAgent
      PRODUCT_BUNDLE_IDENTIFIER: com.barboss.visibility-agent
      DEVELOPMENT_TEAM: 8KK8V96Q6B
      CODE_SIGN_IDENTITY: "Developer ID Application: Artem Svitelskyi (8KK8V96Q6B)"
      ENABLE_HARDENED_RUNTIME: YES
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_LSUIElement: YES
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
